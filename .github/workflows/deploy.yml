name: Deploy to Vercel (production)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install echo-depths-3d dependencies
        working-directory: echo-depths-3d
        run: npm ci

      - name: Run Vitest (96 tests)
        working-directory: echo-depths-3d
        run: npm test -- --run

      - name: Build echo-depths-3d
        working-directory: echo-depths-3d
        run: npm run build

      - name: Deploy to Vercel (production)
        working-directory: echo-depths-3d
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_3yhqT43fxZp9JrgzpcUZCmpb
          VERCEL_PROJECT_ID: prj_s42Kw6wf1BRmonXJKpoyE29m1G9Z
        # Drop --prebuilt: Vercel CLI will auto-detect Vite, run `npm run build`,
        # and deploy the resulting dist/. The CI env is Linux so the npm/cmd.exe
        # Windows quirk that affected local `vercel build` does not apply here.
        run: npx vercel@latest deploy --prod --yes
