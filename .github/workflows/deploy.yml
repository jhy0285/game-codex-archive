name: Deploy to Vercel (production)
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install echo-depths-3d dependencies
        working-directory: echo-depths-3d
        run: npm ci

      - name: Run Vitest (96 tests)
        working-directory: echo-depths-3d
        run: npm test -- --run

      - name: Build echo-depths-3d
        working-directory: echo-depths-3d
        run: npm run build

      - name: Deploy to Vercel (production)
        # Run from REPO ROOT (not echo-depths-3d/) because the Vercel project
        # already has rootDirectory=echo-depths-3d in its settings. Running from the
        # subdirectory would make the CLI compute the project path as
        # repo_root/echo-depths-3d/echo-depths-3d which does not exist.
        # The VERCEL_PROJECT_ID env var tells the CLI which project to use.
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_3yhqT43fxZp9JrgzpcUZCmpb
          VERCEL_PROJECT_ID: prj_s42Kw6wf1BRmonXJKpoyE29m1G9Z
        # --archive points Vercel at the dist/ folder inside echo-depths-3d/.
        # --prod targets production. The CLI uploads the archive directly without
        # trying to re-detect the project from the working directory.
        # No --archive: VERCEL_PROJECT_ID + repo root + Vercel-managed build.
        # The CLI finds the project by VERCEL_PROJECT_ID, resolves the
        # rootDirectory=echo-depths-3d from the project settings, runs
        # `npm run build` (Vite) to populate echo-depths-3d/dist/, and deploys.
        run: npx vercel@latest deploy --prod --yes
