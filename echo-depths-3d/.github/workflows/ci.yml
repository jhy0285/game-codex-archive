name: echo-depths-3d-ci

on:
  push:
    branches: [main, 'fix/echo2-ch3-structural']
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm test -- --run
      - name: Browser runtime suite
        env:
          PLAYWRIGHT_BASE_URL: ''
        run: npm run test:e2e -- --reporter=line
      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            test-results/
            playwright-report/
